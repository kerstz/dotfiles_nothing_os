font_family      Paper Mono
bold_font        Paper Mono
italic_font      Paper Mono
bold_italic_font Paper Mono
font_size 21.7
adjust_line_height 77%
disable_ligatures always

background_opacity 0.0
dynamic_background_opacity no
hide_window_decorations yes
wayland_titlebar_color background
window_padding_width 0
window_margin_width 0
window_border_width 0
single_window_margin_width 0
placement_strategy top-left
remember_window_size no
confirm_os_window_close 0
tab_bar_style hidden
enable_audio_bell no

cursor #1d1d1f
cursor_text_color #efe5d5
cursor_shape block
cursor_trail 0
cursor_blink_interval 0
shell_integration no-cursor

foreground #1c1c1f
text_composition_strategy 1.2 20
background #e8ddcc
selection_foreground #1d1d1f
selection_background #bccde3
url_color #2f7fc8

color0  #3a3a3c
color8  #6f695d
color1  #d9554c
color9  #ea7d6e
color2  #4f8a3d
color10 #6dbd3d
color3  #b5832a
color11 #d9a441
color4  #2f7fc8
color12 #5b9bdc
color5  #a2607f
color13 #c98aa8
color6  #3f8a93
color14 #7fb3bb
color7  #6f695d
color15 #26262a

map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map page_up scroll_page_up
map page_down scroll_page_down
map ctrl+plus change_font_size all +1
map ctrl+minus change_font_size all -1
